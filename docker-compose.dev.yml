services:
  app:
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - ./:/app   # 코드 변경 시 바로 반영
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bookcycle
      MYSQL_USER: bookuser
      MYSQL_PASSWORD: 1234
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"   # 개발용은 3307 포트로 노출
    volumes:
      - db_data:/var/lib/mysql      # 이름 있는 볼륨 사용

  redis:
    image: redis:7
    container_name: book-cycle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
