version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: book-cycle-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookcycle
      MYSQL_USER: bookuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    networks:
      - book-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubookuser", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: book-cycle-redis
    ports:
      - "6379:6379"
    networks:
      - book-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: uzemm/book-cycle:latest
    container_name: book-cycle-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    networks:
      - book-net

networks:
  book-net:
    driver: bridge
