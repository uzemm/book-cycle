version: "3.8"
services:
  app:
    image: w926450@gmail.com/book-cycle:latest
    container_name: book-cycle-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: book-cycle-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookcycle
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    container_name: book-cycle-redis
    ports:
      - "6379:6379"
