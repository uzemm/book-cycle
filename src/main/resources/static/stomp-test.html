<!-- stomp-test.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WebSocket 알림 테스트</title>
</head>
<body>
<h2>WebSocket 알림 테스트</h2>
<button onclick="connect()">🟢 Connect</button>
<button onclick="sendTest()">📤 Send</button>
<button onclick="disconnect()">🔌 Disconnect</button>

<div id="log" style="margin-top: 20px; font-family: monospace;"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stompClient = null;
    const accessToken = "액세스토큰";
    const memberId = 1;

    function connect() {
        const socket = new SockJS("http://localhost:8080/ws-stomp/?access_token=" + accessToken);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            log("[CONNECTED] WebSocket 연결됨 : " + frame);

            // 유저 ID는 백에서 꺼낸 걸로 바꾸기
            stompClient.subscribe(`/sub/member/${memberId}`, function (message) {
                const data = JSON.parse(message.body);
                log("알림 도착: [" + data.type + "] " + data.message);
            });
        }, function (error) {
            log("연결 실패: " + error);
        });
    }

    function sendTest() {
        if (stompClient && stompClient.connected) {
            stompClient.send("/pub/notify", {}, JSON.stringify({}));
        } else {
            log("아직 연결되지 않았습니다.");
        }
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect(function () {
                log("연결 해제됨");
            });
            stompClient = null;
        }
    }

    function log(message) {
        document.getElementById("log").innerHTML += message + "<br>";
    }
</script>
</body>
</html>
