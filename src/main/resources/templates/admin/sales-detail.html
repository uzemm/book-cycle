<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 도서</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
    <style>
        .book-container {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .book-image {
            width: 250px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .book-info {
            flex: 1;
        }
        .price {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .btn-group {
            margin-top: 15px;
        }
        .discount {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="book-container">
        <!-- 도서 이미지 -->
        <img src="https://via.placeholder.com/250" alt="도서 표지" class="book-image">

        <!-- 도서 정보 -->
        <div class="book-info">
            <h2>천 개의 파랑 <span class="text-primary">[뮤지컬 특별판]</span></h2>
            <p class="text-muted">천선란 저 | 허블 | 2020년</p>

            <hr>

            <p><strong>판매가:</strong> <span class="price">12,000원</span></p>
            <p><strong>상품 상태:</strong> 상</p>
            <p><strong>배송료:</strong> 일반 4,000원 | GS반값 · CU알뜰 2,500원</p>
            <p><strong>출고예상일:</strong> 통상 <strong>24시간 이내</strong></p>

            <div class="btn-group">
                <button class="btn btn-danger">장바구니 담기</button>
                <button class="btn btn-primary">바로구매</button>
                <button class="btn btn-outline-secondary">보관함 +</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
