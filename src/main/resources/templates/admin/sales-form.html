<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판매 도서 등록</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-lg mt-5">
    <h1 class="text-center">판매 도서 등록</h1>

    <!-- 검색 입력창 및 버튼 -->
    <div class="mb-3">
        <input type="text" id="searchInput" class="form-control" placeholder="도서 제목을 입력하세요">
        <button id="searchButton" class="btn btn-primary mt-2">검색</button>
    </div>

    <!-- 판매 도서 등록 폼 -->
    <form action="/admin/sales/books" method="post" class="mt-4">
        <div class="form-group">
            <label for="image">도서 표지</label>
            <input type="image" class="form-control" id="image" name="image" readonly>
        </div>

        <div class="form-group">
            <label for="title">도서 제목</label>
            <input type="text" class="form-control" id="title" name="title" readonly>
        </div>

        <div class="form-group">
            <label for="author">저자</label>
            <input type="text" class="form-control" id="author" name="author" readonly>
        </div>

        <div class="form-group">
            <label for="publisher">출판사</label>
            <input type="text" class="form-control" id="publisher" name="publisher" readonly>
        </div>

        <div class="form-group">
            <label for="price">가격</label>
            <input type="number" class="form-control" id="price" name="price" required>
            <p id="price-error" class="field-error text-danger" style="display: none;"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">등록</button>
    </form>
</div>
<!-- 도서 검색 모달 -->
<div class="modal fade modal-xl" id="bookModal" tabindex="-1" aria-labelledby="bookModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">도서 검색</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true"></span>
                </button>
            </div>
            <div class="modal-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>표지</th>
                        <th>도서 제목</th>
                        <th>저자/출판사</th>
                        <th>출판일</th>
                        <th>ISBN</th>
                    </tr>
                    </thead>
                    <tbody id="modalBookTableBody"></tbody>
                </table>
            </div>
            <!-- 검색 결과 목록 -->
            <ul id="bookList" class="list-group mt-3"></ul>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>
<script src="/js/admin/book-search.js"></script>
<!-- 부트스트랩 JS, Popper.js, jQuery -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
