<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg" style="width: 400px;">
        <h2 class="text-center fw-bold mb-3">회원가입</h2>

        <form id="signupForm" action="/auth/signup" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="email" id="email" class="form-control" required>
                <p id="email-error" class="field-error text-danger" style="display: none;"></p>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-control" required>
                <p id="password-error" class="field-error text-danger" style="display: none;"></p>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">이름</label>
                <input type="text" id="name" class="form-control" required>
                <p id="name-error" class="field-error text-danger" style="display: none;"></p>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">휴대폰 번호</label>
                <input type="text" id="phone" class="form-control" required>
                <p id="phone-error" class="field-error text-danger" style="display: none;"></p>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">주소</label>
                <input type="text" id="address" class="form-control" required>
                <p id="address-error" class="field-error text-danger" style="display: none;"></p>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">가입하기</button>
            </div>
        </form>
        <div class="text-center mt-3">
            <a href="login-form" class="text-decoration-none">로그인</a>
        </div>
    </div>
</div>
<script src="/js/auth/signup.js"></script>
</body>
</html>
