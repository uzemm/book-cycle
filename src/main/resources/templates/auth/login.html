<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book-Cycle</title>
        <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
    </head>
</head>
<body>

    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow-lg" style="width: 350px;">
            <h2 class="text-center fw-bold mb-3">로그인</h2>

            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                    <p id="email-error" class="field-error text-danger" style="display: none;"></p>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                    <p id="password-error" class="field-error text-danger" style="display: none;"></p>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">로그인</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="signup-form" class="text-decoration-none">회원가입</a> |
                <a href="/forgot-password" class="text-decoration-none">비밀번호 찾기</a>
            </div>

            <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
                아이디 또는 비밀번호가 잘못되었습니다.
            </div>
        </div>
    </div>
    <script src="/js/auth/login.js"></script>
</body>
</html>
