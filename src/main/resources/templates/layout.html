<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--/*@thymesVar id="CONTENT_TITLE" type=""*/-->
    <title layout:title-pattern="${CONTENT_TITLE} - BookCycle">BookCycle</title>

    <!-- Bootswatch Cerulean 테마 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
    <!-- 부트스트랩 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <!-- 구글 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=42dot+Sans:wght@400..800&family=Roboto+Mono:wght@700&family=Source+Code+Pro:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <!-- 상단 네비게이션 -->
    <header>
        <nav class="navbar">
            <div class="container-fluid justify-content-end">
                <a class="nav-link me-4" href="#">
                    <i class="bi bi-bell-fill"></i>
                    알림
                </a>
                <a class="nav-link" href="#">
                    <i class="bi bi-door-open"></i>
                    로그인
                </a>
            </div>
        </nav>
        <nav class="navbar bg-light">
            <div class="container-fluid d-flex align-items-center">
                <!-- 로고 (왼쪽) -->
                <a class="navbar-brand" href="#">
                    <img src="/image/logo.png" alt="로고" style="width: 50%;">
                </a>

                <!-- 검색 폼 (가운데 정렬) -->
                <form class="d-flex mx-auto" style="width: 40%;">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="검색어를 입력하세요">
                        <button class="btn btn-outline-secondary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </nav>


        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarColor01">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/}">Home
                                <span class="visually-hidden">(current)</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/books}">베스트 도서</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/rentals}">도서 대여</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/myInfo}">내 정보</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main layout:fragment="content">
        <!-- 각 페이지의 본문이 여기에 들어감 -->
    </main>
</div>
</body>
</html>
