services:
  app:
    command: [ "/wait-for-it.sh", "db", "3306", "--", "java", "-jar", "/app.jar" ]
    image: uzemm/book-cycle:latest
    container_name: book-cycle-app
    ports:
      - "8080:8080"  # EC2에서는 보통 8080 그대로 씀
    environment:
      SPRING_PROFILES_ACTIVE: docker   # 🔥 여기서 docker 프로파일 적용
    depends_on:
      db:
        condition: service_healthy   # ✅ DB가 healthcheck 통과해야 실행
      redis:
        condition: service_started
    restart: always
    networks:
      - bookcycle-network

  db:
    image: mysql:8.0
    restart: always
    environment:                    # ✅ 환경변수 추가
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bookcycle
      MYSQL_USER: bookuser
      MYSQL_PASSWORD: 1234
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"                 # ✅ 배포도 3306으로 통일
    volumes:
      - db_data:/var/lib/mysql      # ✅ 이름 있는 볼륨 사용
    networks:
      - bookcycle-network
    healthcheck: # ✅ 추가
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    container_name: book-cycle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data            # ✅ 이름 있는 볼륨 사용
    restart: always
    networks:
      - bookcycle-network

volumes:
  db_data:                          # ✅ 볼륨 이름 통일
  redis_data:

networks:
  bookcycle-network:
    name: bookcycle-network
    driver: bridge
